name: Django CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Django Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django checks and unit tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: a0NKo8dHW6mwPxnYB9uy-YQjVfmsmNQxZyR4dwqWO_-LKgWtbU9aKOOmEE6fd0N-1Nc
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py test

  deploy:
    name: Trigger Render Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Call Render Deploy Hook
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
