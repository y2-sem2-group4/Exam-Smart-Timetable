<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Exam Smart Timetable</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="login">
  <main class="login-wrap">
    <form id="login-form" class="card login-card">
      <a class="brand-lockup" href="../">
        <span class="brand-mark" aria-hidden="true">EST</span>
        <span>Exam Smart Timetable</span>
      </a>
      <h1>Admin login</h1>
      <div id="login-notice" class="msg info hidden" role="status"></div>
      <div id="login-error" class="msg error hidden" role="alert"></div>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="login-btn" class="btn" type="submit">Log in</button>
      <p class="hint">Use your administrator account.</p>
    </form>
  </main>
  <script src="../js/admin.js"></script>
</body>
</html>
