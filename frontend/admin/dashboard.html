<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Exam Smart Timetable</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="dashboard">
  <nav id="nav"></nav>
  <main>
    <h1>Exam Dashboard</h1>
    <div class="controls">
      <label for="status-filter" style="margin:0">Status</label>
      <select id="status-filter">
        <option value="all">All</option>
        <option value="scheduled">Scheduled</option>
        <option value="pending_review">Pending Review</option>
        <option value="resolved">Resolved</option>
      </select>
      <a class="btn light spacer" href="clash.html">Clash Review <span id="clash-count" class="count">0</span></a>
      <a class="btn" href="exam-form.html">+ Log Exam</a>
    </div>
    <div id="page-error" class="msg error hidden"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Unit</th><th>Date</th><th>Time</th><th>Room</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="exam-tbody"></tbody>
      </table>
    </div>
  </main>
  <script src="../js/admin.js"></script>
</body>
</html>
