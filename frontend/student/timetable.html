<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Timetable</title>
    <!-- Fixed path: go up one level to 'frontend/', then into 'css/' -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>Student Exam Timetable</h1>
        <form id="student-search-form" class="student-search">
            <label for="student-search-input">Admission number</label>
            <input id="student-search-input" type="text"
                placeholder="Enter Admission Number e.g. 220965" required>
            <button class="btn" type="submit">Search</button>
        </form>

        <!-- Error Banner (Hidden by default) -->
        <div id="error-banner" class="error-banner" style="display: none;">
            <p id="error-message">Student number not found. Please check and try again.</p>
        </div>

        <!-- Timetable Content -->
        <div id="timetable-container">
            <p id="loading-state">Loading timetable for Student ID: <span id="student-id-display"></span>...</p>
            <p id="empty-state" style="display: none;">No exams scheduled</p>
            <div class="badge-legend" style="margin-bottom: 20px;">
                <span class="badge badge-confirmed">Confirmed</span>
                <span class="badge badge-clash">Clash Flagged</span>
                <span class="badge badge-pending">Pending</span>
            </div>
            <table class="timetable-table" id="exam-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Course Code</th>
                        <th>Course Name</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Room</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="exam-tbody">
                    <!-- Rows will be injected via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Fixed path: go up one level to 'frontend/', then into 'js/' -->
    <script src="../js/student.js"></script>
</body>
</html>
