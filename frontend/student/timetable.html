<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Timetable</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container">
        <h1>Student exam timetable</h1>

        <form id="student-search-form" class="student-search">
            <div class="field">
                <label for="student-search-input">Admission number</label>
                <input id="student-search-input" type="text" autocomplete="off" spellcheck="false"
                    placeholder="e.g. 220965" required>
            </div>
            <button id="search-btn" class="btn" type="submit">Search</button>
        </form>

        <!-- Error banner: announced immediately by screen readers -->
        <div id="error-banner" class="error-banner hidden" role="alert">
            <p id="error-message"></p>
        </div>

        <!-- Loading / empty messages: announced politely -->
        <div aria-live="polite">
            <p id="loading-state" class="state-message hidden"></p>
            <p id="empty-state" class="state-message hidden">No exams scheduled yet. Check back later.</p>
        </div>

        <section id="results" class="hidden" aria-labelledby="results-summary">
            <p id="results-summary" class="student-summary"></p>

            <section id="next-exam" class="next-exam hidden" aria-labelledby="next-exam-heading">
                <h2 id="next-exam-heading">Next exam</h2>
                <p id="next-title" class="next-title"></p>
                <p id="next-when" class="next-when"></p>
                <p id="next-meta" class="next-meta"></p>
            </section>

            <ul class="badge-legend" aria-label="Status key">
                <li><span class="badge badge-confirmed">Confirmed</span>Date, time and room are set</li>
                <li><span class="badge badge-clash">Clash Flagged</span>May be rescheduled</li>
                <li><span class="badge badge-pending">Pending</span>Details being confirmed</li>
            </ul>

            <table class="timetable-table" id="exam-table" role="table">
                <caption class="sr-only">Exams, in date order</caption>
                <thead role="rowgroup">
                    <tr role="row">
                        <th role="columnheader" scope="col">Course code</th>
                        <th role="columnheader" scope="col">Course name</th>
                        <th role="columnheader" scope="col">Date</th>
                        <th role="columnheader" scope="col">Time</th>
                        <th role="columnheader" scope="col">Room</th>
                        <th role="columnheader" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody id="exam-tbody" role="rowgroup">
                    <!-- Rows are injected by student.js -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="../js/student.js"></script>
</body>
</html>
